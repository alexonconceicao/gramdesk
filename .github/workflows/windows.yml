name: windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # anexar arquivos à release da tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine pyinstaller pytest
      - name: Testes
        run: python -m pytest -q tests
      - name: Versão
        id: ver
        shell: bash
        run: echo "version=$(python packaging/windows/make_version.py)" >> "$GITHUB_OUTPUT"
      - name: Configuração de release
        env:
          GRAMDESK_DONATION_URL: ${{ secrets.GRAMDESK_DONATION_URL }}
          GRAMDESK_DONATION_LIQUID: ${{ secrets.GRAMDESK_DONATION_LIQUID }}
          GRAMDESK_DONATION_TITLE: ${{ vars.GRAMDESK_DONATION_TITLE }}
          GRAMDESK_DONATION_TEXT: ${{ vars.GRAMDESK_DONATION_TEXT }}
          GRAMDESK_DONATION_INTERVAL_DAYS: ${{ vars.GRAMDESK_DONATION_INTERVAL_DAYS }}
          GRAMDESK_DONATION_DELAY_DAYS: ${{ vars.GRAMDESK_DONATION_DELAY_DAYS }}
        run: python tools/make_build_info.py
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/gramdesk.spec
      - name: Autoteste do executável
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GRAMDESK_HOME: ${{ runner.temp }}\gramdesk-selftest
          GRAMDESK_SELFTEST_OUT: ${{ runner.temp }}\selftest.json
        run: |
          $p = Start-Process -FilePath dist\Gramdesk\Gramdesk.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content $env:GRAMDESK_SELFTEST_OUT
          if ($p.ExitCode -ne 0) { throw "autoteste falhou ($($p.ExitCode))" }
      - name: Zip portátil
        shell: pwsh
        run: |
          Set-Content -Path dist\Gramdesk\portable.txt -Value "Apague este arquivo para guardar os dados em %APPDATA%. Com ele, os dados ficam na pasta data ao lado do executável."
          Compress-Archive -Path dist\Gramdesk -DestinationPath "dist\Gramdesk-${{ steps.ver.outputs.version }}-windows-portable.zip"
          Remove-Item dist\Gramdesk\portable.txt
      - name: Instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\gramdesk.iss
      - name: Hashes
        shell: pwsh
        run: |
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS-windows.txt
          Get-Content dist\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gramdesk-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows.txt
      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Gramdesk ${GITHUB_REF_NAME#v}" --notes "Build Windows."
          gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.zip dist/SHA256SUMS-windows.txt --clobber
